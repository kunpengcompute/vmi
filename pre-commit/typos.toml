[files]
# these files may be written in non english words
extend-exclude = []
ignore-hidden = true
ignore-files = true
ignore-dot = true
ignore-vcs = true
ignore-global = true
ignore-parent = true

[default]
binary = false
check-filename = false
check-file = true
unicode = true
ignore-hex = true
identifier-leading-digits = false
locale = "en"
extend-ignore-identifiers-re = []
extend-ignore-words-re = []
extend-ignore-re = []

[default.extend-identifiers]
shift_2nd = "shift_2nd"

[default.extend-words]
# arm cpu features
neon = "neon"
sve = "sve"
dotprod = "dotprod"
i8mm = "i8mm"

[type.py]
extend-glob = []
extend-ignore-identifiers-re = []
extend-ignore-words-re = []
extend-ignore-re = []

[type.py.extend-identifiers]

[type.py.extend-words]

[type.cpp]
extend-glob = []
extend-ignore-identifiers-re = []
extend-ignore-words-re = []
extend-ignore-re = []

[type.cpp.extend-identifiers]
countr_one = "countr_one"
streamIn = "streamIn"
streamOut = "streamOut"
hwcomposer = "hwcomposer"
audiostub = "audiostub"
audiovmi = "audiovmi"
audiodev = "audiodev"
gbm = "gbm"
gralloc = "gralloc"

[type.cpp.extend-words]

[type.sh]
extend-glob = []
extend-ignore-identifiers-re = []
extend-ignore-words-re = []
extend-ignore-re = []

[type.sh.extend-identifiers]

[type.sh.extend-words]

[type.vimscript]
extend-glob = []
extend-ignore-identifiers-re = []
extend-ignore-words-re = []
extend-ignore-re = []

[type.vimscript.extend-identifiers]

[type.vimscript.extend-words]
