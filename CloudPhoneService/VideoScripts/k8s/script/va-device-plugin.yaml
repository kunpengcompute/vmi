apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: va-device-plugin-daemonset
  namespace: va-plugin
spec:
  selector:
    matchLabels:
      name: va-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: va-device-plugin-ds
    spec:
      nodeSelector:
        va-device: "va-sg100"
      containers:
        - image: harbor.vatech.com/k8s-plugin/va-vg-device-plugin:arm64-v0.0.4
          name: va-device-plugin-ctr
          env:
          - name: FAIL_ON_INIT_ERROR
            value: "false"
          - name: CONFIG_FILE
            value: "/etc/config-map/config"
          - name: PASS_DEVICE_SPECS
            value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: va-plugin-configs
              mountPath: /etc/config-map
              readOnly: true
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: va-plugin-configs
          configMap:
            name: va-plugin-configs
